<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fun with Animals</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:linear-gradient(160deg,#7c4dff,#ff7a3d);color:#2a1d5c;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
header{text-align:center;color:#fff;padding:14px 12px 6px}
header h1{font-size:1.6rem}
header p{opacity:.9;font-size:.9rem}
.tabs{display:flex;gap:8px;justify-content:center;padding:8px}
.tabs button{border:0;font:inherit;font-weight:700;padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.3);color:#fff;cursor:pointer}
.tabs button.on{background:#fff;color:#7c4dff}
main{flex:1;overflow-y:auto;padding:8px 14px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:700px;margin:0 auto}
.an{background:#fff;border:0;border-radius:22px;padding:14px 6px;font:inherit;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .15s}
.an:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.an span{display:block;font-size:3.4rem;line-height:1.2}
.an b{display:block;font-size:1rem;color:#2a1d5c}
.an i{font-style:normal;font-size:.85rem;color:#7a6fa8}
#pop{position:fixed;inset:0;background:rgba(30,10,80,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#pop.show{display:flex}
.box{background:#fff;border-radius:28px;padding:26px 22px;text-align:center;max-width:340px;width:100%;animation:bounce .4s}
@keyframes bounce{0%{transform:scale(.6)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.box .big{font-size:6rem;line-height:1.1;display:inline-block;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(-8deg) scale(1.06)}}
.box h2{font-size:1.8rem;margin-top:6px}
.box .ur{color:#7a6fa8;margin-bottom:8px}
.box .snd{font-size:1.4rem;font-weight:800;color:#ff7a3d;margin:6px 0}
.box p{color:#4b3f80;margin-bottom:14px}
.btn{border:0;font:inherit;font-weight:700;padding:12px 22px;border-radius:999px;background:#7c4dff;color:#fff;cursor:pointer;margin:4px}
.btn.alt{background:#eee;color:#2a1d5c}
.quiz{max-width:420px;margin:0 auto;text-align:center;color:#fff}
.quiz .big{font-size:7rem;animation:wig 1.6s ease-in-out infinite;display:inline-block}
.quiz h2{margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opts button{border:0;font:inherit;font-weight:700;font-size:1.15rem;padding:14px;border-radius:18px;background:#fff;color:#2a1d5c;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.opts button.ok{background:#3ecf6e;color:#fff}
.opts button.no{background:#ff5470;color:#fff}
.score{margin-top:16px;font-weight:700}
@media (prefers-reduced-motion:reduce){.box,.box .big,.quiz .big{animation:none}}
</style>
</head>
<body>
<header><h1>🐾 Fun with Animals</h1><p>Tap an animal to learn and hear it!</p></header>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Learn</button><button id="t2" onclick="tab(2)">Quiz</button></div>
<main id="main"></main>
<div id="pop" onclick="closePop(event)"><div class="box" id="box"></div></div>
<script>
var A=[
["🦁","Lion","Sher","Roar!","The lion is called the king of the jungle."],
["🐘","Elephant","Haathi","Toot toot!","Elephants have the biggest ears and a very long trunk."],
["🐱","Cat","Billi","Meow!","Cats sleep for most of the day."],
["🐶","Dog","Kutta","Woof woof!","Dogs are loyal and love to play."],
["🐮","Cow","Gaaye","Moo!","Cows give us milk."],
["🐴","Horse","Ghora","Neigh!","Horses can run very fast."],
["🐵","Monkey","Bandar","Ooh ooh!","Monkeys love to climb trees and eat bananas."],
["🦆","Duck","Batakh","Quack quack!","Ducks can swim and fly."],
["🐰","Rabbit","Khargosh","Squeak!","Rabbits hop and love carrots."],
["🐸","Frog","Medak","Ribbit!","Frogs can jump far and live near water."],
["🦜","Parrot","Tota","Squawk!","Parrots can copy human words."],
["🐯","Tiger","Baagh","Grrr!","Every tiger has its own unique stripes."]
];
var main=document.getElementById("main"),pop=document.getElementById("pop"),box=document.getElementById("box");
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.9;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function tab(n){document.getElementById("t1").classList.toggle("on",n==1);document.getElementById("t2").classList.toggle("on",n==2);n==1?learn():quiz()}
function learn(){
  main.innerHTML='<div class="grid">'+A.map(function(a,i){return '<button class="an" onclick="show('+i+')"><span>'+a[0]+'</span><b>'+a[1]+'</b><i>'+a[2]+'</i></button>'}).join("")+'</div>';
}
function show(i){
  var a=A[i];
  box.innerHTML='<span class="big">'+a[0]+'</span><h2>'+a[1]+'</h2><div class="ur">'+a[2]+'</div><div class="snd">'+a[3]+'</div><p>'+a[4]+'</p><button class="btn" onclick="say(\''+a[1]+'. '+a[3]+'\')">🔊 Listen</button><button class="btn alt" onclick="pop.classList.remove(\'show\')">Close</button>';
  pop.classList.add("show");say(a[1]+". "+a[3]);
}
function closePop(e){if(e.target===pop)pop.classList.remove("show")}
var score=0,total=0;
function quiz(){
  var c=A[Math.floor(Math.random()*A.length)],o=[c];
  while(o.length<3){var r=A[Math.floor(Math.random()*A.length)];if(o.indexOf(r)<0)o.push(r)}
  o.sort(function(){return Math.random()-.5});
  main.innerHTML='<div class="quiz"><span class="big">'+c[0]+'</span><h2>Which animal is this?</h2><div class="opts">'+o.map(function(a){return '<button onclick="pick(this,'+(a===c?1:0)+')">'+a[1]+'</button>'}).join("")+'</div><div class="score">⭐ Score: '+score+' / '+total+'</div></div>';
  main.dataset.say=c[1];
}
function pick(b,ok){
  total++;var all=b.parentNode.querySelectorAll("button");
  all.forEach(function(x){x.disabled=true});
  if(ok){score++;b.classList.add("ok");say("Great job! "+main.dataset.say)}else{b.classList.add("no");say("Oops! It is "+main.dataset.say)}
  setTimeout(quiz,1500);
}
learn();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
